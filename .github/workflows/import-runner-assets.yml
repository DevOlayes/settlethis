name: Import Football Runner avatar and animations

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/import-runner-assets.yml"
      - "scripts/import-runner-assets.mjs"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import-assets:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Download and verify avatar and CC0 animation packs
        run: node scripts/import-runner-assets.mjs
      - name: Commit bundled assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/assets/football-runner
          if git diff --cached --quiet; then
            echo "No asset changes to commit."
          else
            git commit -m "Bundle verified Football Runner avatar and animations"
            git fetch origin main
            git rebase origin/main
            git push
          fi
