name: Native Biped run frame audit
on:
  push:
    branches: [main]
    paths:
      - "scripts/analyze-native-biped-run.mjs"
      - "scripts/analyze-native-biped-slide.mjs"
      - "src/football-runner/NativeBipedPoseTools.ts"
      - "src/football-runner/NativeBipedManeuvers.ts"
      - "src/football-runner/NativeBipedJump.ts"
      - ".github/workflows/native-biped-run-audit.yml"
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - name: Decode and inspect every native run keyframe
        run: node scripts/analyze-native-biped-run.mjs
      - name: Compile production slide solver for contact audit
        run: npx tsc src/football-runner/NativeBipedPoseTools.ts src/football-runner/NativeBipedManeuvers.ts --target ES2022 --module ES2022 --moduleResolution bundler --skipLibCheck --outDir .tmp-audit
      - name: Evaluate production slide hand and foot contact on the original rig
        run: |
          mkdir -p .tmp-audit
          printf '{"type":"module"}' > .tmp-audit/package.json
          node scripts/analyze-native-biped-slide.mjs
