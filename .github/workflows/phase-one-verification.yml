name: Phase One verification

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Audit dependency vulnerabilities
        run: npm audit --audit-level=high
      - name: Build application and Worker
        run: npm run build
      - name: Run automated unit tests
        run: npm test
      - name: Package production Worker and static assets
        run: npx wrangler deploy --dry-run --outdir worker-bundle
      - name: Preserve production release bundle
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: sethis-production-bundle-${{ github.sha }}
          path: |
            dist/
            worker-bundle/
            wrangler.jsonc
          retention-days: 3
