name: Phase One verification

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      # Resolve the dependency tree from package.json, update the committed lockfile, and verify it with a clean install below.
      - name: Resolve dependencies and generate the npm lockfile
        run: npm install --no-audit --no-fund
      - name: Commit generated lockfile to main
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          if [ -n "$(git status --porcelain -- package-lock.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add package-lock.json
            git commit -m "chore: lock npm dependencies"
            git push origin HEAD:main
          fi
      - name: Install exact locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Audit dependency vulnerabilities
        run: npm audit --audit-level=high
      - name: Build application and Worker
        run: npm run build
      - name: Run automated unit tests
        run: npm test
      - name: Package production Worker and static assets
        run: npx wrangler deploy --dry-run --outdir worker-bundle
      - name: Preserve production release bundle
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: sethis-production-bundle-${{ github.sha }}
          path: |
            dist/
            worker-bundle/
            wrangler.jsonc
          retention-days: 3
      - name: Deploy production Worker when Cloudflare credentials are configured
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 678b6f8f8cd615747fc2d27320a2ecca
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::CLOUDFLARE_API_TOKEN is missing. Production deployment is blocked; configure the repository Actions secret before treating this build as deployed."
            exit 1
          fi
          npx wrangler deploy --keep-vars --message "SETHIS production release from main"
